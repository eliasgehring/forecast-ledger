[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-ledger"
version = "0.1.0"
description = "A live, auditable AI forecasting system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "openai==2.47.0",
    "streamlit>=1.40,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"